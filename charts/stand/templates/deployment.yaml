apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}

  labels:
    app: {{ .Release.Name | quote }}
    branch: {{ .Release.Name | trimPrefix "stand-" | quote }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name | quote }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name | quote }}
        branch: {{ .Release.Name | trimPrefix "stand-" | quote }}

    spec:

      initContainers:
        - name: prepare-connection-strings

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              echo "Preparing ConnectionStrings.config..."

              cp \
                /app/ConnectionStrings.config \
                /config/ConnectionStrings.config

              sed -i \
                's#<add name="db".*#<add name="db" connectionString="Server={{ .Values.database.host }};Port={{ .Values.database.port }};Database={{ .Values.database.name }};User Id={{ .Values.database.user }};Password={{ .Values.database.password }};" />#' \
                /config/ConnectionStrings.config

              sed -i \
                's#<add name="redis".*#<add name="redis" connectionString="host={{ .Values.redis.host }};db={{ .Values.redis.database }};port={{ .Values.redis.port }}" />#' \
                /config/ConnectionStrings.config

              echo "ConnectionStrings.config prepared."

          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

          volumeMounts:
            - name: config
              mountPath: /config


      containers:
        - name: creatio

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /app/ConnectionStrings.config
              subPath: ConnectionStrings.config

          resources:
            {{- toYaml .Values.resources | nindent 12 }}


      volumes:
        - name: config
          emptyDir: {}