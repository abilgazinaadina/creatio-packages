apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: {{ .Release.Name }}

spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}

  hostnames:
    - {{ .Values.route.host | quote }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}